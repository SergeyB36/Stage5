version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/stage5
      - static_volume:/stage5/static
      - media_volume:/stage5/media
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - .env.docker

  postgres:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    container_name: stage5_redis
    ports:
      - "6379:6379"
    command: >
      redis-server
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
