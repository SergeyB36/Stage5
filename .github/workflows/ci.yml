  deploy:
    runs-on: ubuntu-latest

#    needs: test

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_KEY }}
            ssh -T git@github.com

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} \
            "cd ${{ secrets.DEPLOY_DIR }} && \
             git remote set-url origin git@github.com:SergeyB36/Stage5.git && \
             git fetch origin && \
             git checkout homework_35+ && \
             git pull origin homework_35+"


